name: Fork CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  linux-smoke:
    name: Linux smoke
    if: github.repository == 'factory-sam/vscode'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Check out the event commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Check AGENTS.md links
        run: timeout --kill-after=2s 10s node build/lib/checkAgentsLinks.ts

      - name: Run build-script smoke tests
        run: |
          timeout --kill-after=5s 60s node --test \
            build/lib/test/checkAgentsLinks.test.ts \
            build/lib/test/pnpm.test.ts \
            build/lib/test/extensionTarget.test.ts \
            build/lib/test/runWithTimeout.test.ts
